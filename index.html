<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>anica's workshop</title>

        <style>
            @font-face {
                font-family: 'Anicatxt';
                src: url('Anicatxt-Regular.ttf') format('truetype');
            }

            body {
                background-color: #f4ebe7;
                margin: 0;
                padding: 0;
                font-family: 'Anicatxt', sans-serif;
            }

             .wobbly-border {
                border: 2px solid #1f1d1c;
                filter: url(#hand-drawn);
              }
        </style>
    </head>

    <body>
        <svg width="0" height="0">
          <filter id="hand-drawn">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
          </filter>
        </svg>
        
        <h1>test file to see the font</h1>
    </body>
</html>
